name: Compilar FFMod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
    - name: Descarregar código fonte
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Aceitar todas as Licenças do Android SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

    - name: Gerar Gradle Wrapper (se em falta)
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Compilar APK (Release)
      run: ./gradlew assembleRelease

    - name: Guardar APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: FFMod-Release-APK
        path: app/build/outputs/apk/release/*.apk
