name: Build FFMod NDK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Android NDK
        uses: ndk-build/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Compile Native Library
        run: |
          cd app/jni
          ndk-build NDK_PROJECT_PATH=../.. APP_BUILD_SCRIPT=./Android.mk -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: libfiremod.so
          path: app/libs/arm64-v8a/libfiremod.so
